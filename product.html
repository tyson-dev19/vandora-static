<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Detail</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="css/layout.css" rel="stylesheet">
<link href="css/product.css" rel="stylesheet">
<link href="css/contactseller.css" rel="stylesheet">

</head>

<body>

<div id="appHeader"></div>

<div id="shopBanner"></div>

<!-- CONTACT SELLER -->
<div class="shop-contact-bar">
<button id="contactSellerBtn" class="contact-seller-btn">
Contact Seller
</button>
</div>

<div class="container py-4">

  <div class="detail-container">

    <a id="backBtn" class="back-link d-inline-block">← Back</a>

    <div class="gallery mt-3">

      <div class="main-image-container">

        <div class="image-badges" id="imageBadges"></div>

        <img id="mainImage" alt="Product image">

      </div>

      <div class="thumbnail-strip" id="thumbnailContainer"></div>

    </div>

    <div class="mt-3">

      <div class="product-title" id="productName"></div>

      <div class="price-row mt-1">

        <div class="price" id="productPrice"></div>

        <div class="old-price" id="productOldPrice"></div>

      </div>

      <span id="stockBadge" class="badge-stock"></span>

    </div>

    <hr class="my-4">

    <div>

      <div class="section-title">Description</div>

      <p id="productDescription"></p>

    </div>

    <hr class="my-4">

    <div>

      <div class="section-title">Related Products</div>

      <div class="related-grid" id="relatedContainer"></div>

    </div>

  </div>

</div>

<div id="appFooter"></div>

<script src="js/layout.js"></script>
<script src="js/product.js"></script>

<script src="js/contactseller.js"></script>

<script>

initContactSeller({

facebook:[
{label:"MSP Fashion Page",url:"#"}
],

tiktok:[
{label:"@mspfashion",url:"#"}
],

telegram:[
{label:"MSP Official Channel",url:"#"}
],

phone:[
{label:"+959111111111",url:"tel:+959111111111"},
{label:"+959222222222",url:"tel:+959222222222"},
{label:"+959333333333",url:"tel:+959333333333"}
],

viber:[
{label:"+959123456789",url:"viber://chat?number=959123456789"},
{label:"+959987654321",url:"viber://chat?number=959987654321"}
]

});

</script>

</body>

</html>
