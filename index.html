<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendora – Discover Shops</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="css/layout.css" rel="stylesheet">
<link href="css/index.css" rel="stylesheet">

</head>

<body>

<div id="appHeader"></div>

<div class="container py-4">

  <!-- ADVERTISEMENT -->
  <div class="ad-slider">

    <div class="ad-slide" id="adSlide">

      <img id="adImage" alt="Advertisement">

      <div class="ad-overlay">
        <div class="ad-title" id="adTitle"></div>
        <div class="ad-category" id="adCategory"></div>
      </div>

    </div>

    <div class="ad-dots" id="adDots"></div>

  </div>

  <!-- CATEGORY FILTER -->
  <div class="d-flex justify-content-start mb-3">

    <div class="sort-wrapper">

      <button class="sort-pill" type="button" onclick="toggleCategoryMenu()">
        Category: <span id="currentCategoryLabel">All</span> ▼
      </button>

      <div class="sort-menu" id="categoryMenu">
        <div onclick="selectCategory('All')">All</div>
        <div onclick="selectCategory('Fashion')">Fashion</div>
        <div onclick="selectCategory('Beauty')">Beauty</div>
        <div onclick="selectCategory('Electronics')">Electronics</div>
        <div onclick="selectCategory('Food')">Food</div>
        <div onclick="selectCategory('Accessories')">Accessories</div>
        <div onclick="selectCategory('Handmade')">Handmade</div>
      </div>

    </div>

  </div>

  <!-- SHOP GRID -->
  <div class="row g-4" id="shopList"></div>

</div>

<!-- PAGINATION -->
<div class="container">
  <div id="pagination" class="text-center mb-5"></div>
</div>

<div id="appFooter"></div>

<script src="js/layout.js"></script>
<script src="js/index.js"></script>

</body>
</html>
